<title>Fısıltı Film</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Tek bakış (sinema): koyu, bilinçli olarak tek tema. Sahne tam ekran tuval; altyazı sol altta, kontroller en altta. */
:root {
  --bg: #070C1A;
  --ink: #EFEAE0;
  --muted: #A2ADC4;
  --coral: #F08A5D;
  --blue: #6FA3E0;
  --deep: #C0512F;
  --grey: #7F8AA3;
  --line: rgba(239, 234, 224, 0.16);
  --panel: rgba(9, 15, 32, 0.66);
  --serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --gutter: max(16px, 4vw);
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--sans); overflow: hidden; }
#stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#stage:active { cursor: grabbing; }
.scrim { position: fixed; left: 0; right: 0; bottom: 0; height: 62%; pointer-events: none;
  background: linear-gradient(to top, rgba(7, 12, 26, 0.92) 8%, rgba(7, 12, 26, 0.55) 45%, rgba(7, 12, 26, 0)); }
.topbar { position: fixed; left: 0; right: 0; top: 0; display: flex; justify-content: space-between; align-items: baseline;
  gap: 16px; padding: calc(14px + env(safe-area-inset-top, 0px)) var(--gutter) 14px; pointer-events: none; }
.brand { font-family: var(--serif); font-size: 20px; letter-spacing: 0.02em; }
.brand span { font-family: var(--sans); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); margin-left: 10px; }
.counter { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.story { position: fixed; left: var(--gutter); bottom: calc(92px + env(safe-area-inset-bottom, 0px));
  width: min(640px, calc(100% - 2 * var(--gutter))); display: flex; flex-direction: column; gap: 12px;
  transition: opacity 0.6s ease, transform 0.6s ease; }
.story.out { opacity: 0; transform: translateY(8px); }
.story > * { margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--coral); font-weight: 600; }
.title { font-family: var(--serif); font-weight: 600; font-size: clamp(28px, 4.2vw, 54px); line-height: 1.08; text-wrap: balance; }
.story.hero .title { font-size: clamp(56px, 11vw, 132px); line-height: 0.98; letter-spacing: -0.01em; }
.body { font-size: clamp(15px, 1.45vw, 19px); line-height: 1.55; color: var(--muted); max-width: 60ch; }
.stats { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 4px 0 0; }
.stats li { font-family: var(--mono); font-size: 13.5px; font-variant-numeric: tabular-nums; padding: 6px 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--panel); backdrop-filter: blur(6px);
  display: inline-flex; align-items: center; gap: 8px; }
.stats .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 12px var(--gutter) calc(14px + env(safe-area-inset-bottom, 0px)); }
.segs { flex: 1 1 260px; min-width: 0; display: flex; gap: 4px; }
.seg { flex: 1; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer; display: flex; align-items: center; }
.seg i { display: block; width: 100%; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.seg i b { display: block; height: 100%; width: 0; background: var(--coral); }
.seg:focus-visible, .btn:focus-visible { outline: 2px solid var(--coral); outline-offset: 2px; }
.btn { font: 500 14px var(--sans); color: var(--ink); background: var(--panel); border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; }
.btn:hover { border-color: rgba(240, 138, 93, 0.6); }
.btn svg { width: 14px; height: 14px; fill: currentColor; }
.btn.primary { background: var(--coral); color: #1A0F0A; border-color: var(--coral); }
body.cinema .topbar, body.cinema .controls { opacity: 0; pointer-events: none; }
body.cinema .story { bottom: calc(48px + env(safe-area-inset-bottom, 0px)); }
.topbar, .controls { transition: opacity 0.4s ease; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px var(--gutter); text-align: center; color: var(--muted); }
@media (max-width: 640px) {
  .brand span { display: none; }
  .story { bottom: calc(118px + env(safe-area-inset-bottom, 0px)); }
  .btn .lbl { display: none; }
}
@media (prefers-reduced-motion: reduce) { .story { transition: none; } }
body.render .story { transition: none; }
</style>

      inBall(i, 1.0, o); o.x += c0[0]; o.y += c0[1]; o.z += c0[2]; o.c = LAYER[k]; o.s = 5.5; o.a = 0.65;
    }
  }
  const DIRS = [[0.6, 0.6, 0.5], [-0.75, 0.2, 0.62], [0.1, -0.8, 0.59]].map(v => { const l = Math.hypot(...v); return v.map(x => x / l); });
  function bio(i, t, o) {
    const y = 1 - 2 * (i + 0.5) / N, r = Math.sqrt(1 - y * y), th = i * 2.399963;
    const x = Math.cos(th) * r, z = Math.sin(th) * r;
    o.x = x * 3.1; o.y = y * 3.1; o.z = z * 3.1;
    for (let j = 0; j < 3; j++) {
      const d = DIRS[j];
      if (x * d[0] + y * d[1] + z * d[2] > 0.93) {
        o.c = [COL.coral, COL.sand, COL.teal][j]; o.s = 10; o.a = 0.7 + 0.3 * Math.sin(t * 2.5 + j); return;
      }
    }
    o.c = mix(COL.dim, COL.blue, 0.35); o.s = 5; o.a = 0.55;
  }
  function funnel(i, t, o) {
    if (h(i, 15) < 0.04) {
      o.x = (h(i, 16) - 0.5) * 0.6; o.y = -2.8 + (h(i, 17) - 0.5) * 0.4; o.z = (h(i, 18) - 0.5) * 0.6;
      o.c = COL.coral; o.s = 11; o.a = 0.95; return;
    }
    const p = (h(i, 13) + t * 0.11 * motion) % 1, rad = 3.3 * Math.pow(1 - p, 1.35) + 0.18, ang = h(i, 14) * TAU + p * 5;
    o.x = rad * Math.cos(ang); o.y = 3.1 - p * 5.6; o.z = rad * Math.sin(ang);
    o.c = mix(COL.dim, COL.coral, ss(0.4, 1, p)); o.s = 4.5 + 5 * ss(0.6, 1, p); o.a = 0.35 + 0.6 * ss(0.5, 1, p);
  }
  function lock(i, t, o) {
    const flash = 1 + 0.8 * Math.exp(-((t - 2.5) ** 2) * 6);
    if (i % 10 < 7) {
      o.x = (h(i, 15) - 0.5) * 3.2; o.y = -2.2 + h(i, 16) * 2.5; o.z = (h(i, 17) - 0.5) * 0.6;
      const keyhole = o.x * o.x * 4 + (o.y + 1.0) ** 2 < 0.25;
      o.c = mix(COL.sand, COL.cream, 0.4); o.s = 5; o.a = keyhole ? 0.04 : Math.min(1, 0.6 * flash);
    } else {
      const u = h(i, 18), lift = 0.9 * (1 - ss(0.8, 2.4, t)), w = (h(i, 19) - 0.5) * 0.22;
      if (u < 0.7) { const ang = Math.PI * (u / 0.7); o.x = (1.15 + w) * Math.cos(ang); o.y = 0.3 + (1.15 + w) * Math.sin(ang) + lift; }
      else { const side = h(i, 20) < 0.5 ? -1 : 1; o.x = side * (1.15 + w); o.y = 0.3 - ((u - 0.7) / 0.3) * 0.6 + lift; }
      o.z = (h(i, 21) - 0.5) * 0.3; o.c = COL.coral; o.s = 6.5; o.a = Math.min(1, 0.85 * flash);

  }
  function valid(i, t, o) {
    if (i >= 1800) return dust(i, o);
    const c = i % 3; inBall(i, 1.25, o); o.x += (c - 1) * 3.6;
    const lit = ss(0.6 + c * 1.7, 1.6 + c * 1.7, t);
    o.c = mix(COL.dim, COL.coral, lit); o.s = 5 + 3 * lit; o.a = 0.35 + 0.55 * lit;
  }
  function finale(i, t, o) {
    o.x = (i / N) * 16 - 8;
    const clean = ss(0.6, 5.5, t);
    if (i % 3 === 0) {
      o.y = 1.3 + Math.sin(o.x * 1.05 + t * 1.3 * motion) * 0.9 * clean + (h(i, 20) - 0.5) * 3.2 * (1 - clean);
      o.z = (h(i, 21) - 0.5) * 0.4 * (1 - clean); o.c = mix(COL.grey, COL.coral, clean); o.s = 6 + 3 * clean; o.a = 0.55 + 0.4 * clean;
    } else {
      o.y = 1.3 + (h(i, 20) - 0.5) * 3.2; o.z = (h(i, 21) - 0.5) * 1.5; o.c = COL.dim; o.s = 4.5; o.a = 0.45 * (1 - 0.75 * clean);
    }
  }

  // ---- Sahneler (metinler proje sonuçlarından; sayılar results/ tablolarıyla aynı) ----
  const SCENES = [
    { dur: 9, hero: true, eyebrow: 'Kastamonu Üniversitesi · AR-GE Proje Pazarı 2026', title: 'Fısıltı',
      body: 'Pankreas kanseri kanda neredeyse duyulmayan bir iz bırakır. Bu film, o izi verilerle nasıl aradığımızı anlatıyor.',
      stats: [], cam: [0, 0.7, 9.5], look: [0, 0, 0], direct: true, fill: (i, t, o) => blood(i, t, o, 0.9, 'normal') },
    { dur: 9, eyebrow: 'Problem', title: 'Sessiz ilerleyen bir kanser',
      body: 'Hastaların çoğu ameliyatın artık mümkün olmadığı evrede tanı alıyor. Klinikteki tek kan belirteci CA19-9 yeterince güvenilir değil.',
      stats: [{ t: '5 yıllık sağkalım < %10' }, { t: 'Geç tanı' }, { t: 'CA19-9 sınırlı' }],
      cam: [0, 0.4, 8.5], look: [0, 0, 0], direct: true, fill: (i, t, o) => blood(i, t, o, 0.35, 'quiet') },
    { dur: 10, eyebrow: 'Veri', title: 'Yedi kohort, dört omik katmanı',
      body: 'CPTAC’ta 140 tümör ve 92 normal doku, dört katmanda aynı hastalarda ölçülmüş. Dört bağımsız doku ve iki serum kohortu doğrulama için ayrıldı.',
      stats: [{ t: 'mRNA', dot: '--blue' }, { t: 'protein', dot: '--coral' }, { t: 'miRNA', dot: '#E6C98F' }, { t: 'metilasyon', dot: '#6CC3B5' }],
      cam: [0, 4.6, 8.4], look: [0, 0.2, 0], fill: layers },
    { dur: 10, eyebrow: 'Veri kalitesi', title: 'Sonucu sessizce bozacak altı tuzak',
      body: 'Hiçbiri hata mesajı vermiyordu. Kamuya açık bir dosyada “normal” diye verilen miRNA verisi, tümörün birebir kopyasıydı.',
      stats: [{ t: 'Kopya dosya · 21/21' }, { t: 'Kayıp evre · 35 → 2' }, { t: 'Hasta sızıntısı' }, { t: 'Model kısayolu · 0,986 → 0,973' }],
      cam: [0, 4.2, 8.8], look: [0, 0.8, 0], fill: traps },
    { dur: 13, eyebrow: 'MOFA+ · gerçek veri', title: 'Her nokta bir doku örneği',
      body: 'Normal dokular tümörlerden ayrılıyor, ama bu eksen kanserin kendisi değil: enzim üreten dokunun kaybı. Kan testi için bir tuzak; bu genleri dışladık.',
      stats: [{ t: 'Normal doku · 92', dot: '--blue' }, { t: 'Erken evre · 83', dot: '--coral' }, { t: 'Geç evre · 51', dot: '--deep' }],
      cam: [0, 1.2, 10.5], look: [0, 0, 0], wobble: 0.45, fill: mofa },
    { dur: 11, eyebrow: 'Yapay zekâ', title: '600 model, hasta bazlı doğrulama',
      body: 'Aynı hastanın örnekleri asla hem eğitimde hem testte olmadı. Dört omiği birleştiren dikkat modeli, tek omikten daha iyi değildi: tek ucuz test yeterli olabilir.',
      stats: [{ t: 'Protein AUC 0,99' }, { t: 'mRNA 0,99' }, { t: 'Metilasyon 0,99' }, { t: 'miRNA 0,98' }],
      cam: [0, 0, 10.5], look: [0, 0, 0], direct: true, fill: ai },
    { dur: 10, eyebrow: 'Biyoloji', title: 'Model bilinen biyolojiyi kendi buldu',
      body: 'Önceden söylenmeden: KRAS sinyali, epitel-mezenkimal geçiş, p53 yolağı; miR-21, miR-196a, SERPINB5 ve TFPI2.',
      stats: [{ t: 'KRAS sinyali', dot: '--coral' }, { t: 'Epitel-mezenkimal geçiş', dot: '#E6C98F' }, { t: 'p53 yolağı', dot: '#6CC3B5' }],
      cam: [0, 0.6, 10], look: [0, 0, 0], spin: 0.18, fill: bio },
    { dur: 10, eyebrow: 'Panel tasarımı', title: 'Dokudan kana: eleme hunisi',
      body: 'Dokuda güçlü olan her aday kanda ölçülemiyor. Serumda ölçülebilirlik ve salgılanma kanıtı zorunlu kriter oldu.',
      stats: [{ t: 'miRNA · 40 → 15 → 5' }, { t: 'Protein · 39 → 31 → 8' }],
      cam: [0, 1.4, 10], look: [0, 0, 0], direct: true, fill: funnel },
    { dur: 9, eyebrow: 'Ön-kayıt · 30 Eylül 2026', title: 'Sonucu görmeden kilitledik',
      body: 'Panel ve analiz planı, kan verisindeki etiketlere bakılmadan Git’e zaman damgasıyla işlendi. Kural: sonuç ne çıkarsa çıksın değiştirilmez.',
      stats: [{ t: '18:20 · panel kilitlendi' }, { t: '19:25 · analiz planı kaydedildi' }],
      cam: [0, 0, 9], look: [0, -0.3, 0], fill: lock },
    { dur: 11, eyebrow: 'Gerçeğin anı 1 · kan', title: 'miRNA paneli kanda çalışmadı',
      body: 'İki serum kohortu birbirini bile doğrulamıyor. Kendi içinde “mükemmel” görünen sonuçlar başka kohorta taşınmıyor.',
      stats: [{ t: 'AUC 0,54' }, { t: 'AUC 0,40' }, { t: 'CA19-9 duyarlılığı %74' }, { t: 'kohortlar arası ρ = 0,02' }],
      cam: [0, 0.7, 9.5], look: [0, 0, 0], direct: true, fill: (i, t, o) => blood(i, t, o, 0.6, 'lost') },
    { dur: 11, eyebrow: 'Gerçeğin anı 2 · bağımsız doku', title: 'Protein paneli üç kohortta doğrulandı',
      body: 'Farklı ülkeler, farklı hastalar, farklı ölçüm teknolojisi. Sekiz genin sekizi, üç kohortun üçünde de beklenen yönde.',
      stats: [{ t: 'GSE15471 · 0,92' }, { t: 'GSE62452 · 0,87' }, { t: 'GSE16515 · 0,95' }, { t: 'Erken evre · 0,86' }],
      cam: [0, 1, 10.5], look: [0, 0, 0], fill: valid },
    { dur: 11, hero: false, eyebrow: 'Sıradaki adım · Kastamonu EAH ile plazma pilotu', title: 'Fısıltıyı duymak için önce gürültüyü ayıklamak gerekir.',
      body: 'Sekiz proteinlik aday panel, gerçek hastaların plazmasında test edilmeye hazır.',
      stats: [{ t: 'github.com/Soap2647/Fisilti' }],
      cam: [0, 0.2, 9.5], look: [0, 0, 0], fill: finale }

  // ---- Arayüz ----
  const $ = id => document.getElementById(id);
  const storyEl = $('story'), segsEl = $('segs');
  const segBars = SCENES.map((s, k) => {
    const b = document.createElement('button');
    b.className = 'seg'; b.type = 'button'; b.setAttribute('aria-label', `${k + 1}. sahne: ${s.title}`);
    b.innerHTML = '<i><b></b></i>'; b.addEventListener('click', () => go(k));
    segsEl.appendChild(b); return b.querySelector('b');
  });
  const pad = n => String(n).padStart(2, '0');
  let textTimer = 0;
  function renderText(s, k) {
    $('counter').textContent = `${pad(k + 1)} / ${pad(SCENES.length)}`;
    storyEl.classList.toggle('hero', !!s.hero);
    $('eyebrow').textContent = s.eyebrow; $('title').textContent = s.title; $('body').textContent = s.body;
    const ul = $('stats'); ul.innerHTML = '';
    s.stats.forEach(st => {
      const li = document.createElement('li');
      if (st.dot) { const d = document.createElement('span'); d.className = 'dot'; d.style.background = st.dot.startsWith('--') ? `var(${st.dot})` : st.dot; li.appendChild(d); }
      li.appendChild(document.createTextNode(st.t)); ul.appendChild(li);
    });
  }
  function showText(s, k, first) {
    if (first || reduced || RENDER) { renderText(s, k); return; }
    clearTimeout(textTimer); storyEl.classList.add('out');
    textTimer = setTimeout(() => { renderText(s, k); storyEl.classList.remove('out'); }, 450);
  }

  // ---- Three.js ----
  let renderer;
  const canvas = $('stage');
  try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false }); }
  catch (e) { renderer = null; }
  if (!renderer || typeof THREE === 'undefined') {
    const f = document.createElement('div'); f.className = 'fallback';
    f.textContent = 'Bu cihazda 3B çizim (WebGL) açılamadı. Altyazılar ve kontroller yine de çalışır.';
    document.body.appendChild(f);
  }
  const scene = renderer ? new THREE.Scene() : null;
  const camera = renderer ? new THREE.PerspectiveCamera(50, 1, 0.1, 100) : null;
  const P = new Float32Array(N * 3), C = new Float32Array(N * 3), SZ = new Float32Array(N), AL = new Float32Array(N);
  const o = { x: 0, y: 0, z: 0, c: COL.dim, s: 4, a: 0.3 };
  let points = null;
  if (renderer) {
    renderer.setClearColor(0x070C1A, 1);
    renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
    for (let i = 0; i < N; i++) {
      SCENES[0].fill(i, 0, o);
      P[i * 3] = o.x; P[i * 3 + 1] = o.y; P[i * 3 + 2] = o.z;
      C[i * 3] = o.c[0]; C[i * 3 + 1] = o.c[1]; C[i * 3 + 2] = o.c[2]; SZ[i] = o.s; AL[i] = o.a;
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(P, 3));
    geo.setAttribute('acolor', new THREE.BufferAttribute(C, 3));
    geo.setAttribute('asize', new THREE.BufferAttribute(SZ, 1));
    geo.setAttribute('aalpha', new THREE.BufferAttribute(AL, 1));
    const mat = new THREE.ShaderMaterial({
      uniforms: { uPixel: { value: renderer.getPixelRatio() } },
      vertexShader: `attribute vec3 acolor; attribute float asize; attribute float aalpha; uniform float uPixel;
        varying vec3 vC; varying float vA;
        void main(){ vC = acolor; vA = aalpha; vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = asize * uPixel * (10.5 / max(0.5, -mv.z)); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `precision mediump float; varying vec3 vC; varying float vA;
        void main(){ vec2 c = gl_PointCoord - vec2(0.5); float d = length(c); if (d > 0.5) discard;
          float a = smoothstep(0.5, 0.05, d); gl_FragColor = vec4(vC * a, a * vA); }`,
      transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
    });
    points = new THREE.Points(geo, mat); points.frustumCulled = false; scene.add(points);
  }

  function resize() {
    if (!renderer) return;
    const w = window.innerWidth, hh = window.innerHeight;
    renderer.setSize(w, hh, false); camera.aspect = w / hh; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  // ---- Zamanlama ----
  let cur = 0, lt = 0, elapsed = 0, playing = true, cinema = false;
  function go(k, first) {
    cur = (k + SCENES.length) % SCENES.length; lt = 0; elapsed = 0;
    showText(SCENES[cur], cur, first);
    segBars.forEach((b, j) => { b.style.width = j < cur ? '100%' : '0%'; });
  }
  function setPlaying(p) {
    playing = p;
    $('play').setAttribute('aria-label', p ? 'Duraklat' : 'Oynat'); $('playLbl').textContent = p ? 'Duraklat' : 'Oynat';
    $('playIcon').innerHTML = p ? '<path d="M4 2.5h3v11H4zm5 0h3v11H9z"/>' : '<path d="M4.5 2.5 13 8l-8.5 5.5z"/>';
  }
  $('prev').addEventListener('click', () => go(cur - 1));
  $('next').addEventListener('click', () => go(cur + 1));
  $('play').addEventListener('click', () => setPlaying(!playing));
  function enterCinema() {
    cinema = true; document.body.classList.add('cinema'); go(0); setPlaying(true);
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen().catch(() => {});
  }
  function exitCinema() {
    cinema = false; document.body.classList.remove('cinema');
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => {});
  }
  $('cinema').addEventListener('click', enterCinema);
  document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && cinema) exitCinema(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && cinema) exitCinema();
    else if (e.key === 'ArrowRight') go(cur + 1);
    else if (e.key === 'ArrowLeft') go(cur - 1);
    else if (e.key === ' ' && e.target === document.body) { e.preventDefault(); setPlaying(!playing); }
  });

  // Fareyle / dokunarak sahneyi döndürme
  let yaw = 0, pitch = 0, drag = null;
  canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', e => {
    if (!drag) return;
    yaw += (e.clientX - drag.x) * 0.005; pitch = Math.max(-0.6, Math.min(0.6, pitch + (e.clientY - drag.y) * 0.003));
    drag = { x: e.clientX, y: e.clientY };
  });
  const endDrag = () => { drag = null; };
  canvas.addEventListener('pointerup', endDrag); canvas.addEventListener('pointercancel', endDrag);

  const camPos = new (renderer ? THREE.Vector3 : Object)(); const camLook = renderer ? new THREE.Vector3() : null;
  if (renderer) { camPos.set(...SCENES[0].cam); camLook.set(...SCENES[0].look); }
  let T = 0, last = performance.now(), rot = 0;
  let done = false;
  function step(dt) {
    T += dt; lt += dt;
    const s = SCENES[cur];
    if (playing) {
      elapsed += dt;
      if (elapsed >= s.dur) {
        if (cur === SCENES.length - 1) { setPlaying(false); elapsed = s.dur; done = true; if (cinema && !RENDER) exitCinema(); }
        else go(cur + 1);
      }
    }
    segBars[cur].style.width = `${Math.min(100, (elapsed / SCENES[cur].dur) * 100)}%`;
    if (renderer) {
      const sc = SCENES[cur];
      const k = 1 - Math.exp(-dt * 2.4), kk = sc.direct && lt > 1.6 ? 1 : k;
      for (let i = 0; i < N; i++) {
        sc.fill(i, lt, o);
        const j = i * 3;
        P[j] += (o.x - P[j]) * kk; P[j + 1] += (o.y - P[j + 1]) * kk; P[j + 2] += (o.z - P[j + 2]) * kk;
        C[j] += (o.c[0] - C[j]) * k; C[j + 1] += (o.c[1] - C[j + 1]) * k; C[j + 2] += (o.c[2] - C[j + 2]) * k;
        SZ[i] += (o.s - SZ[i]) * k; AL[i] += (o.a - AL[i]) * k;
      }
      const g = points.geometry;
      g.attributes.position.needsUpdate = true; g.attributes.acolor.needsUpdate = true;
      g.attributes.asize.needsUpdate = true; g.attributes.aalpha.needsUpdate = true;
      if (sc.spin) rot += sc.spin * dt * motion;
      else {
        // wobble: tam tur yerine hafif salınım (ayrım her an görünür kalsın)
        const target = sc.wobble ? sc.wobble * Math.sin(lt * 0.35 * motion) : 0;
        rot = Math.atan2(Math.sin(rot), Math.cos(rot)); rot += (target - rot) * k;
      }
      points.rotation.y = rot;
      const far = camera.aspect < 1 ? 1.55 : 1, shift = camera.aspect > 1.3 ? -1.8 : 0;
      const sway = reduced ? 0 : Math.sin(T * 0.12) * 0.08;
      const bx = sc.cam[0] - sc.look[0], by = sc.cam[1] - sc.look[1], bz = sc.cam[2] - sc.look[2];
      const a = yaw + sway, cx = bx * Math.cos(a) + bz * Math.sin(a), cz = -bx * Math.sin(a) + bz * Math.cos(a);
      const tx = sc.look[0] + shift + cx * far, ty = sc.look[1] + (by + pitch * 6) * far, tz = sc.look[2] + cz * far;
      camPos.x += (tx - camPos.x) * k; camPos.y += (ty - camPos.y) * k; camPos.z += (tz - camPos.z) * k;
      camLook.x += (sc.look[0] + shift - camLook.x) * k; camLook.y += (sc.look[1] - camLook.y) * k; camLook.z += (sc.look[2] - camLook.z) * k;
      camera.position.copy(camPos); camera.lookAt(camLook);
      renderer.render(scene, camera);
    }
    if (RENDER) {
      // Altyazı: sahne başında 0,6 sn içinde belirir, sonunda 0,5 sn içinde kaybolur
      const d = SCENES[cur].dur, fin = cur === SCENES.length - 1 ? 1 : Math.min(1, (d - elapsed) / 0.5);
      storyEl.style.opacity = String(Math.max(0, Math.min(1, lt / 0.6, fin)));
    }
  }
  function frame(now) {
    step(Math.min(0.05, (now - last) / 1000)); last = now;
    requestAnimationFrame(frame);
  }
  go(0, true);
  if (RENDER) {
    document.body.classList.add('cinema', 'render');
    window.__film = { fps: 30, total: SCENES.reduce((a, s) => a + s.dur, 0), step: () => { step(1 / 30); return done; } };
  } else {
    requestAnimationFrame(frame);
  }
})();
</script>
